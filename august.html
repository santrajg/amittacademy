<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Games - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,100,0.4), rgba(0,0,50,0.8));
            z-index: 1;
        }

        .container {
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-register {
            background: linear-gradient(to bottom, #4caf50, #1b5e20);
            color: white;
            border-color: #ffeb3b;
            text-shadow: 1px 1px 2px #000;
        }

        .btn-login {
            background: linear-gradient(to bottom, #37474f, #1a232e);
            color: #ffeb3b;
            border-color: #90caf9;
            text-shadow: 1px 1px 2px #000;
        }

        #loadingMessage {
            color: white;
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <h1 style="color: gold; font-size: 40px; text-shadow: 2px 2px 5px red; margin-bottom: 50px;">MONEY<br>GAMES</h1>
        
        <button class="btn btn-register" id="registerBtn">⭐ REGISTER</button>
        <button class="btn btn-login" id="loginBtn">🔑 LOGIN</button>
        
        <p id="loadingMessage">Processing Google Login...</p>
    </div>

    <!-- Firebase JS SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

        // Aapki di hui Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDLhdWCB-q3E66rZmbuaj1dpopq-vYbDDA",
            authDomain: "money-gamess.firebaseapp.com",
            databaseURL: "https://money-gamess-default-rtdb.firebaseio.com",
            projectId: "money-gamess",
            storageBucket: "money-gamess.firebasestorage.app",
            messagingSenderId: "186867379540",
            appId: "1:186867379540:web:cc1579684ec17b04112cc1",
            measurementId: "G-4PMK2EFQ3L"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();
        
        // Custom Client ID for Google Auth
        provider.setCustomParameters({
            client_id: "186867379540-im2h67h0nafv1pmmm7tmu9eq0eso5lhh.apps.googleusercontent.com"
        });

        // Unique 8-digit referral code generator
        function generateReferralCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Main Login/Register Function
        async function handleGoogleAuth() {
            document.getElementById('loadingMessage').style.display = 'block';
            
            try {
                // Google se login popup
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                // Realtime Database me user ka reference banayein
                const userRef = ref(db, 'users/' + user.uid);
                const snapshot = await get(userRef);

                let userData;

                if (!snapshot.exists()) {
                    // FIRST TIME REGISTRATION
                    console.log("New user registered!");
                    
                    userData = {
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        balance: 5, // Pehli baar aane par ₹5
                        referralCode: generateReferralCode(),
                        createdAt: new Date().toISOString()
                    };

                    // Realtime Database me data SAVE karein
                    await set(userRef, userData);
                } else {
                    // EXISTING USER LOGIN
                    console.log("Existing user logged in!");
                    userData = snapshot.val(); 
                }

                // Local Storage me save karein 
                localStorage.setItem("userSession", JSON.stringify(userData));

                alert(`Welcome ${userData.name}! Balance: ₹${userData.balance}\nReferral Code: ${userData.referralCode}`);
                
                // Yahan aap redirect kar sakte hain (example: window.location.href = "home.html";)

            } catch (error) {
                console.error("Error during authentication: ", error);
                alert("Login failed: " + error.message);
            } finally {
                document.getElementById('loadingMessage').style.display = 'none';
            }
        }

        document.getElementById('registerBtn').addEventListener('click', handleGoogleAuth);
        document.getElementById('loginBtn').addEventListener('click', handleGoogleAuth);
    </script>
</body>
</html>
