<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independence Day Wishing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9933 0%, #ffffff 50%, #138808 100%);
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Main Container */
        .main-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Full Background Image Layer */
        .bg-image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-image-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.18; /* Light background watermark effect */
        }

        /* Moving Borders */
        .border-track {
            position: absolute;
            top: 0;
            width: 40px;
            height: 100%;
            overflow: hidden;
            z-index: 10;
        }

        .left-border {
            left: 0;
        }

        .right-border {
            right: 0;
        }

        .border-content {
            position: absolute;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Left Border Animation: Upward */
        .left-border .border-content {
            animation: moveUp 10s linear infinite;
        }

        /* Right Border Animation: Downward */
        .right-border .border-content {
            animation: moveDown 10s linear infinite;
        }

        .border-item {
            width: 30px;
            height: 30px;
            margin: 10px 0;
            border-radius: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 16px;
        }

        @keyframes moveUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        @keyframes moveDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        /* Content Area */
        .content {
            padding: 20px 45px;
            text-align: center;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .greeting-text h2 {
            font-size: 15px;
            color: #333;
            margin-top: 10px;
        }

        .main-title {
            font-size: 32px;
            color: #e65100;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            margin: 5px 0;
            line-height: 1.1;
        }

        .main-title span {
            color: #2e7d32;
        }

        /* Soldier Graphic Section matching reference layout */
        .soldier-section {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }

        .soldier-img {
            width: 160px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            z-index: 2;
        }

        .footer-btn {
            background: #2e7d32;
            color: white;
            padding: 12px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 15px;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .footer-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Background Image Layer (Using https://imghosting.in/host/s2cfdp as background scene) -->
        <div class="bg-image-layer">
            <img src="https://imghosting.in/host/s2cfdp" alt="Background Scene">
        </div>

        <!-- Left Moving Border (Upward) -->

                <div class="border-item">💖</div>

        <!-- Center Content -->

                    <div class="main-title">स्वतंत्रता<br><span>दिवस</span></div>
                    <h3 style="color: #2e7d32; font-size: 16px; margin-top: 5px;">की हार्दिक बधाई एवं शुभकामनाएं</h3>
                </div>

                </svg>
                यहाँ से सबको भेजें ➔
            </button>

        <!-- Right Moving Border (Downward) -->

                <div class="border-item">🇮🇳</div>
                <!-- Repeating for seamless loop -->

                <div class="border-item">🛞</div>
                <div class="border-item">🇮🇳</div>

                <div class="border-item">💖</div>

                <!-- Repeating for seamless loop -->

                <div class="border-item">🇮🇳</div>
            </div>
        </div>
    </div>

    <script>
        // WhatsApp Share Functionality with hint/placeholder text
        function shareOnWhatsApp() {
            let personName = prompt("यहाँ अपना नाम लिखें:"); // अब इसमें कोई डिफ़ॉल्ट नाम लिखा हुआ नहीं आएगा, केवल हिंट दिखेगा
            if (personName && personName.trim() !== "") {
                let currentUrl = window.location.href.split('?')[0];
                let shareUrl = `${currentUrl}?name=${encodeURIComponent(personName)}`;
                let whatsappMessage = `*${personName}* ने आपके लिए स्वतंत्रता दिवस का एक सुंदर संदेश भेजा है। यहाँ क्लिक करके देखें 👇\n${shareUrl}`;
                let whatsappLink = `https://api.whatsapp.com/send?text=${encodeURIComponent(whatsappMessage)}`;
                window.open(whatsappLink, '_blank');
            }
        }
    </script>

</body>
</html>
